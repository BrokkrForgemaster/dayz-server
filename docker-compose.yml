services:
  dayz-server:
    container_name: dayz-wolfs-den
    build:
      context: .
      dockerfile: Dockerfile
    image: dayz-wolfs-den:latest
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 120s
    # Loki's existing six physical cores and their SMT siblings.
    cpuset: "10-15,26-31"
    env_file:
      - .env
    ports:
      - "2302:2302/udp"
      - "2303:2303/udp"
      - "2304:2304/udp"
      - "2305:2305/udp"
      - "2306:2306/udp"
      - "27016:27016/udp"
    volumes:
      - /mnt/user/appdata/dayz/server:/dayz/server
      - /mnt/user/appdata/dayz/config:/dayz/config
      - /mnt/user/appdata/dayz/profiles:/dayz/profiles
      - /mnt/user/appdata/dayz/workshop:/dayz/workshop
      - /mnt/user/appdata/dayz/backups:/dayz/backups
      - /mnt/user/appdata/dayz/steam-home:/home/dayz
    security_opt:
      - no-new-privileges:true
